  - decl: public struct CSGOptions
    doc: |-
      Post-processing and tolerances for mesh CSG.

      The robust Boolean itself needs no tolerances: its precision comes from the inputs'
      bounding boxes, and exact ties are broken symbolically.
    source: Sources/SwiftMesh/CSG.swift:112
    members:
    - decl: 'public init(mergeCoplanar: Bool = true, coplanarAngleTolerance: Float = 1e-4, coplanarDistanceTolerance: Float = 1e-4, attributes: MeshAttributes = [])'
