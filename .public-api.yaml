      doc: |-
        Creates a mesh from existing topology and attribute arrays.

        - Parameters:
          - topology: The wiring.
          - positions: One position per topology vertex.
          - normals: Optional per-corner normals, one per half-edge.
          - textureCoordinates: Optional per-corner UVs, one per half-edge.
          - tangents: Optional per-corner tangents, one per half-edge.
          - bitangents: Optional per-corner bitangents, one per half-edge.
          - colors: Optional per-corner colors, one per half-edge.
          - submeshes: Face groups. `nil` puts every face in one submesh.
      source: Sources/SwiftMesh/Mesh.swift:86
    - decl: 'public init(vertexArrays arrays: VertexArrays, opposites: [UInt32]? = nil)'
      doc: |-
        Rebuilds a triangle mesh from indexed vertex arrays.

        Output vertices with the same ``Mesh/VertexArrays/sourceVertices`` entry become one mesh
        vertex. Each triangle becomes a face; each submesh keeps its label. With `opposites`
        (see ``Mesh/VertexArrays/cornerTable()``), twins are wired exactly; otherwise topology is
        rebuilt from shared vertices. Signed (`.float4`) tangents keep only xyz.
      source: Sources/SwiftMesh/VertexArrays+Decoding.swift:61
