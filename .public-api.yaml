        Samples the scalar field on a regular grid and produces triangles at the
        zero crossing. Negative values are considered inside the surface.
        The resulting mesh is welded and has the requested attributes applied.

        - Parameters:
          - resolution: Number of grid cells along each axis.
          - bounds: The axis-aligned region to sample. Defaults to the unit cube centered at the origin.
          - isoValue: The field value defining the isosurface. Defaults to `0`.
          - attributes: Mesh attributes to generate (normals, UVs, etc.).
          - field: A closure mapping a 3D position to a scalar value.
        - Returns: A mesh representing the isosurface.
