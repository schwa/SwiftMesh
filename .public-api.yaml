    - decl: 'public func destViaNext(of e: HalfEdgeID) -> VertexID?'
      doc: |-
        Destination vertex of a half-edge, found via the next pointer.
        Works even when the half-edge has no twin.
      source: Sources/SwiftMesh/HalfEdgeTopology.swift:162
    - decl: 'public func edgeLoop(from halfEdge: HalfEdgeID) -> [HalfEdgeID]'
      doc: |-
        The edge loop through `halfEdge`, one half-edge per edge, in walking order.

        At each vertex with exactly four edges the loop continues straight through to the
        opposite edge (Blender-style). It stops at vertices of any other valence (poles) and
        at boundaries. A loop that returns to `halfEdge` is closed; otherwise the result runs
        from one stopping vertex to the other and includes `halfEdge`.
      source: Sources/SwiftMesh/EdgeLoop.swift:8
    - decl: public func facesToFlipForConsistentWinding() -> Set<FaceID>?
      doc: |-
        Faces to reverse so every shared edge is used in opposite directions.

        Propagates orientation from one face per connected component and flips the
        smaller side. Returns `nil` if some component is non-orientable (for example a
        Möbius strip), where no choice of flips works.
      source: Sources/SwiftMesh/MeshDiagnostics.swift:276
    - decl: '@discardableResult public mutating func flipEdge(_ halfEdge: HalfEdgeID) -> Bool'
      doc: |-
        Replace the edge shared by two triangles with the other diagonal of their quad.

        Triangles (a, b, c) and (b, a, d) around edge a–b become (d, c, a) and (c, d, b).
        The same half-edge ids are reused: `halfEdge` becomes d → c and its twin c → d.

        - Returns: `false` (and changes nothing) if the edge is on a boundary, either face
          is not a triangle or has holes, the opposite vertices coincide, or edge c–d already exists.
      source: Sources/SwiftMesh/EdgeFlip.swift:10
