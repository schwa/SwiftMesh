    - decl: 'public func border(thickness: Float = 0.02, direction: BorderDirection = .inside, triangulate: Bool = false, attributes: MeshAttributes = .default) -> Mesh'
      doc: |-
        Generate a "border" mesh: a quad-strip frame around every face.

        For each face in the input mesh, an inset (or outset) copy of the
        boundary loop is created, and quad faces are emitted connecting
        the original boundary vertices to the offset boundary vertices.
        The result looks like a picture-frame or "phat wireframe" that
        follows the face topology instead of the edges.

        - Parameters:
          - thickness: How far to offset the inner/outer loop from the
            original boundary, measured along the face plane.
          - direction: Whether to inset or outset the loop.
          - triangulate: If `true`, each quad in the border strip is split
            into two triangles (simple fan, no earcut needed).
          - attributes: Which derived attributes to compute on the result.
        - Returns: A new mesh composed of border strips around every face.
      source: Sources/SwiftMesh/Wireframe.swift:140
    - decl: 'public func catmullClarkSubdivided(iterations: Int = 1) -> Mesh'
      doc: |-
        Applies Catmull-Clark subdivision to a mesh.

        Each face is split by inserting a face point at its centroid and edge
        points at edge midpoints (adjusted by neighboring face points), then
        connecting them to form quads. Works on meshes with any polygon type
        (triangles, quads, n-gons) — the output is always quads.

        Per-corner attributes (normals, UVs, tangents, colors) and submeshes
        are not preserved. Call attribute-generation methods on the result
        if needed.

        - Parameter iterations: Number of subdivision passes. Each pass
          roughly quadruples the face count.
        - Returns: A new subdivided mesh.
      source: Sources/SwiftMesh/Subdivision.swift:210
    - decl: 'public func chamfered(distance: Float, segments: Int = 1, edges: Set<HalfEdgeTopology.HalfEdgeID>? = nil, attributes: MeshAttributes = []) -> Mesh?'
      doc: |-
        Bevel edges with a single flat face of width about `distance`.

        Each chamfered edge becomes a quad strip. Faces shrink away from chamfered edges:
        a corner between two chamfered edges moves `distance` inside both edges (in the face
        plane); otherwise the corner slides `distance` along each unchamfered edge, so faces
        on either side share the new point. Vertices touching chamfered edges get a patch
        polygon when at least three distinct points surround them (for example a cube
        corner with all three edges chamfered); with one chamfered edge the adjacent face
        absorbs the cut instead.

        With `segments` > 1 each strip curves into a rounded fillet: N quads along a quadratic
        Bezier from one side to the other, with the original edge as the control point, so the
        round meets both faces tangentially. Vertex patches follow the arcs; they are simple
        polygons, not true spherical blends.

        - Parameters:
          - distance: How far the cut reaches from each chamfered edge along the faces.
          - segments: Quads across each strip. 1 is a flat chamfer; more gives a fillet.
          - edges: Half-edges to chamfer (either direction of an edge selects it). `nil`
            chamfers every edge.
          - attributes: Attributes to derive on the result. Input per-corner attributes
            are not carried over.
        - Returns: The chamfered mesh, or `nil` if the mesh is not a closed manifold.
      source: Sources/SwiftMesh/EdgeChamfer.swift:27
    - decl: public mutating func compact()
      doc: Rebuild the mesh without tombstoned faces, vertices, and half-edges, remapping indices and per-corner attributes.
      source: Sources/SwiftMesh/Decimation.swift:331
    - decl: 'public func csg(_ operation: CSGOperation, _ other: Mesh, options: CSGOptions = .init()) -> Mesh'
      doc: |-
        Performs a CSG operation with the robust Boolean (a Swift port of Manifold's).

        Both inputs must be closed manifolds; vertices at the same position (for example
        split at UV seams) are merged first. For manifold inputs the result is always a
        closed manifold: exact coincidences (touching or coplanar faces) are resolved by
        symbolic perturbation, so touching solids union into one and a mesh minus itself is
        empty. Degenerate slivers are removed, per-corner attributes are interpolated from
        the inputs (an attribute is kept only if both inputs have it), and submeshes are
        merged into one.

        An empty operand (no faces) counts as the empty solid: union returns the other mesh,
        intersection is empty, and difference returns `self`.

        - Returns: The result, or an empty mesh if either input is not a closed manifold.
      source: Sources/SwiftMesh/CSG.swift:77
