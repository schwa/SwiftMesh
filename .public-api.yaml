          - normalAngleTolerance: Forwarded to ``planarCharts(normalAngleTolerance:planeOffsetTolerance:faces:)``.
          - planeOffsetTolerance: Forwarded to ``planarCharts(normalAngleTolerance:planeOffsetTolerance:faces:)``.
