  - decl: public struct Mesh
    doc: |-
      A mesh combining half-edge topology with SoA vertex/corner attributes.

      Positions are per-vertex (indexed by `VertexID.raw`).
      Normals, UVs, and colors can be per-vertex or per-corner (indexed by `HalfEdgeID.raw`).
      Material assignment is per-face (indexed by `FaceID.raw`).
    source: Sources/SwiftMesh/Mesh.swift:8
    members:
    - decl: public struct PlanarChart
      doc: |-
        A connected, coplanar group of faces.

        Charts are produced by region-growing across the half-edge topology:
        faces only merge when they share an edge *and* their planes are similar.
        This keeps disconnected coplanar pieces (e.g. two parallel walls) in
        separate charts.
      source: Sources/SwiftMesh/Mesh+PlanarCharts.swift:10
