    - decl: 'public func bakingPlanarAtlas(texelsPerMeter: Float = 256, atlasSize: SIMD2<Int> = [2_048, 2_048], padding: Int = 2, normalAngleTolerance: Float = 5 * .pi / 180, planeOffsetTolerance: Float = 0.01) throws -> (mesh: Mesh, atlas: AtlasLayout)'
